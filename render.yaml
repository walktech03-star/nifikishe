services:
  - type: web
    name: nifikishe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3000
      # Optional: shared keys. Set real secrets in Render dashboard.
      # - key: ADMIN_KEY
      #   sync: false
      # - key: DRIVER_KEY
      #   sync: false
