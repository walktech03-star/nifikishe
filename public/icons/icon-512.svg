<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle Route Map Graphic Curve in Background -->
  <path d="M 90 420 Q 200 380 256 256 T 422 92" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-dasharray="16, 20" opacity="0.35"/>
  <circle cx="90" cy="420" r="18" fill="#ffffff" opacity="0.4"/>
  <circle cx="422" cy="92" r="18" fill="#ffffff" opacity="0.4"/>

  <!-- Iconic African Compass & Letter 'N' Emblem -->
  <g filter="url(#shadow)">
    <!-- White Letter N -->
    <path d="M 160 360 L 160 152 L 212 152 L 300 290 L 300 152 L 352 152 L 352 360 L 300 360 L 212 222 L 212 360 Z" fill="#ffffff"/>
  </g>

  <!-- Location Pin Sparkle on top-right of N -->
  <circle cx="370" cy="140" r="28" fill="#fbbf24" stroke="#ffffff" stroke-width="6"/>
  <circle cx="370" cy="140" r="10" fill="#d97706"/>
</svg>
