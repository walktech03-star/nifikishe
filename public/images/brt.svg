<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="brtSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="brtBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="brtGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="340" fill="url(#brtSkyGrad)" rx="16"/>
  <!-- Dedicated BRT Blue Road lane -->
  <rect y="260" width="600" height="80" fill="#1e293b"/>
  <rect y="255" width="600" height="8" fill="#3b82f6"/> <!-- Dedicated BRT divider curb -->
  <line x1="0" y1="300" x2="600" y2="300" stroke="#f8fafc" stroke-width="4" stroke-dasharray="25, 20"/>

  <!-- Shadow under bus -->
  <ellipse cx="300" cy="275" rx="240" ry="18" fill="#0f172a" opacity="0.4"/>

  <!-- Long Modern BRT Body (Articulated / Express) -->
  <rect x="70" y="75" width="460" height="175" rx="22" fill="url(#brtBlueGrad)"/>
  
  <!-- BRT Golden Accent Line (UDART style) -->
  <rect x="70" y="185" width="460" height="12" fill="#fbbf24"/>
  <rect x="70" y="197" width="460" height="40" fill="#ffffff"/>

  <!-- Digital Destination LED Screen -->
  <rect x="220" y="85" width="160" height="26" rx="4" fill="#020617"/>
  <text x="300" y="103" fill="#f59e0b" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">01 KIMARA - GEREZANI</text>

  <!-- Large Windshield & Aerodynamic Front -->
  <path d="M 470 85 L 525 125 L 525 180 L 470 180 Z" fill="url(#brtGlassGrad)" rx="6"/>
  <!-- Continuous Modern Panoramic Glass Windows -->
  <rect x="90" y="115" width="65" height="60" rx="4" fill="url(#brtGlassGrad)"/>
  <rect x="160" y="115" width="70" height="60" rx="4" fill="url(#brtGlassGrad)"/>
  <rect x="235" y="115" width="70" height="60" rx="4" fill="url(#brtGlassGrad)"/>
  <rect x="310" y="115" width="70" height="60" rx="4" fill="url(#brtGlassGrad)"/>
  <rect x="385" y="115" width="70" height="60" rx="4" fill="url(#brtGlassGrad)"/>

  <!-- Passenger Silhouettes -->
  <circle cx="195" cy="140" r="13" fill="#ffffff" opacity="0.7"/>
  <circle cx="270" cy="140" r="13" fill="#ffffff" opacity="0.7"/>
  <circle cx="345" cy="140" r="13" fill="#ffffff" opacity="0.7"/>
  <circle cx="420" cy="140" r="13" fill="#ffffff" opacity="0.7"/>
  <circle cx="500" cy="142" r="14" fill="#ffffff" opacity="0.9"/> <!-- Driver -->

  <!-- Modern Dual Center High-Platform Boarding Doors -->
  <rect x="232" y="125" width="76" height="110" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="270" y1="125" x2="270" y2="235" stroke="#64748b" stroke-width="2"/>

  <!-- Modern LED Headlights -->
  <rect x="525" y="195" width="8" height="25" rx="3" fill="#f8fafc"/>

  <!-- Heavy Triple-Axle Wheels -->
  <g>
    <circle cx="140" cy="250" r="34" fill="#0f172a"/>
    <circle cx="140" cy="250" r="18" fill="#94a3b8"/>
    <circle cx="215" cy="250" r="34" fill="#0f172a"/>
    <circle cx="215" cy="250" r="18" fill="#94a3b8"/>
    <circle cx="465" cy="250" r="34" fill="#0f172a"/>
    <circle cx="465" cy="250" r="18" fill="#94a3b8"/>
  </g>

  <!-- Tag Label -->
  <rect x="20" y="20" width="165" height="28" rx="14" fill="#0f172a" opacity="0.85"/>
  <text x="102" y="38" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">🚍 BRT MWENDOKASI (UDART)</text>
</svg>
