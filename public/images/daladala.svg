<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background backdrop -->
  <rect width="600" height="340" fill="url(#skyGrad)" rx="16"/>
  <!-- Road ground -->
  <rect y="260" width="600" height="80" fill="#334155"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#f8fafc" stroke-width="4" stroke-dasharray="25, 20"/>
  
  <!-- Shadow under bus -->
  <ellipse cx="300" cy="275" rx="220" ry="18" fill="#0f172a" opacity="0.35"/>

  <!-- Bus Main Body (Daladala Coaster) -->
  <rect x="110" y="70" width="380" height="180" rx="28" fill="url(#bodyGrad)"/>
  
  <!-- Iconic Dar Daladala Blue & Red Stripes -->
  <rect x="110" y="180" width="380" height="18" fill="#2563eb"/>
  <rect x="110" y="198" width="380" height="8" fill="#dc2626"/>

  <!-- Front Windshield -->
  <path d="M 420 85 L 470 120 L 470 170 L 420 170 Z" fill="url(#glassGrad)" rx="4"/>
  <!-- Side Passenger Windows -->
  <rect x="130" y="88" width="55" height="75" rx="6" fill="url(#glassGrad)"/>
  <rect x="195" y="88" width="65" height="75" rx="6" fill="url(#glassGrad)"/>
  <rect x="270" y="88" width="65" height="75" rx="6" fill="url(#glassGrad)"/>
  <rect x="345" y="88" width="65" height="75" rx="6" fill="url(#glassGrad)"/>

  <!-- Passenger Silhouette Heads -->
  <circle cx="225" cy="120" r="14" fill="#1e293b" opacity="0.65"/>
  <circle cx="300" cy="120" r="14" fill="#1e293b" opacity="0.65"/>
  <circle cx="375" cy="120" r="14" fill="#1e293b" opacity="0.65"/>
  <circle cx="445" cy="122" r="15" fill="#0f172a" opacity="0.8"/> <!-- Driver -->

  <!-- Front Headlights -->
  <rect x="475" y="195" width="16" height="20" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="483" cy="205" r="5" fill="#ffffff"/>

  <!-- Iconic Destination Board On Top (Kibao cha Daladala) -->
  <rect x="210" y="42" width="180" height="32" rx="6" fill="#047857" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="300" y="63" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1.5" text-anchor="middle">MBEZI - KARIAKOO</text>

  <!-- Wheels -->
  <g>
    <!-- Rear Wheel -->
    <circle cx="180" cy="250" r="34" fill="#1e293b"/>
    <circle cx="180" cy="250" r="20" fill="#94a3b8"/>
    <circle cx="180" cy="250" r="8" fill="#475569"/>
    <!-- Front Wheel -->
    <circle cx="410" cy="250" r="34" fill="#1e293b"/>
    <circle cx="410" cy="250" r="20" fill="#94a3b8"/>
    <circle cx="410" cy="250" r="8" fill="#475569"/>
  </g>

  <!-- Side door -->
  <line x1="340" y1="163" x2="340" y2="245" stroke="#94a3b8" stroke-width="3"/>
  <line x1="410" y1="178" x2="410" y2="216" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Badge Label Tag -->
  <rect x="20" y="20" width="140" height="28" rx="14" fill="#0f172a" opacity="0.85"/>
  <text x="90" y="38" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">🚌 DALADALA YA KAWAIDA</text>
</svg>
